  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232B5D87'/%3E%3Ccircle cx='11' cy='20' r='4' fill='white'/%3E%3Ccircle cx='21' cy='11' r='4' fill='%2350AEB7'/%3E%3C/svg%3E">
</head>
<body>
  <header id="topbar">
    <button id="menu" type="button" aria-label="Toggle navigation">☰</button>
    <a class="brand" href="#/">Elicit.js <span>VIBE recreations</span></a>
    <nav class="toplinks" aria-label="Pages">
      <a href="#/" data-page="overview">Overview</a>
      <a href="#/analysis" data-page="analysis">Analysis</a>
    </nav>
  </header>
  <div id="shell">
    <aside id="sidebar"><nav id="nav"></nav></aside>
    <main id="main"><p class="muted" style="padding:2rem">Loading…</p></main>
  </div>

  <script src="vendor/elicit-bundle.js"></script>
  <script src="assets/registry.js"></script>
  <script src="assets/catalog.js"></script>
  <script src="entries/manifest.js"></script>
  <script>
    // Entry files are listed once in entries/manifest.js; load them in order,
    // then start the app. Plain <script> insertion works from file:// too.
    (function load(files, i) {
      if (i >= files.length) {
        const s = document.createElement('script'); s.src = 'assets/app.js'; document.body.append(s); return;
      }
      const s = document.createElement('script');
      s.src = 'entries/' + files[i];
      s.onload = s.onerror = function () { load(files, i + 1); };
      document.body.append(s);
    })(window.ENTRY_FILES || [], 0);
  </script>
</body>
</html>
